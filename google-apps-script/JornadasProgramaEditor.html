<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar programa · Jornadas IA 2026</title>
    <style>
      :root {
        --bg: #f4f7f4;
        --card: #fff;
        --ink: #1a2e1c;
        --muted: #5a6b5c;
        --line: #d5e0d6;
        --green: #1f5c3a;
        --green-soft: #e8f2eb;
        --danger: #8b2e2e;
        --warn: #8a6d1d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #eef5ef 0%, #f7f4ef 50%, #eef2f7 100%);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
      }
      header h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        font-weight: 700;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 1.25rem 1rem 3rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
      }
      .badge {
        display: inline-block;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        background: var(--green-soft);
        color: var(--green);
      }
      .badge--manual {
        background: #fff3cd;
        color: var(--warn);
      }
      .badge--deny {
        background: #f8e8e8;
        color: var(--danger);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      button,
      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 0.45rem 0.75rem;
        border-radius: 6px;
        font-size: 0.875rem;
        cursor: pointer;
      }
      button.primary {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-weight: 600;
      }
      button.danger {
        color: var(--danger);
        border-color: #e0b4b4;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .msg {
        font-size: 0.875rem;
        color: var(--muted);
        min-height: 1.25rem;
      }
      .msg--err {
        color: var(--danger);
      }
      .msg--ok {
        color: var(--green);
      }
      .item {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.75rem;
        margin-bottom: 0.65rem;
        background: #fafcfb;
      }
      .item--fijo {
        background: #f3f5f3;
      }
      .item-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }
      .item-meta {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .item-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin: 0.35rem 0 0.15rem;
      }
      input[type="text"],
      select {
        width: 100%;
        padding: 0.4rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 0.9rem;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      @media (max-width: 640px) {
        .row2 {
          grid-template-columns: 1fr;
        }
      }
      .check {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.55rem;
        font-size: 0.875rem;
      }
      .check input {
        width: auto;
      }
      a.sitio {
        color: var(--green);
      }
      #deny,
      #app {
        display: none;
      }
      #deny.show,
      #app.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Programa · Jornadas IA 2026</h1>
      <p>
        Observatorio de IA · UCCuyo ·
        <a class="sitio" href="<?= sitioUrl ?>" target="_blank" rel="noopener"
          >Ver en el sitio</a
        >
      </p>
    </header>
    <main>
      <div id="deny" class="card">
        <span class="badge badge--deny">Sin acceso</span>
        <p id="denyText" style="margin: 0.75rem 0 0.35rem">
          Esta página es solo para el equipo del Observatorio.
        </p>
        <p class="msg" id="denyEmail"></p>
        <p class="msg">
          Entrá con tu cuenta Google institucional (p. ej.
          asistente.inv@uccuyo.edu.ar). Si ya entraste y no figura, pedí que te
          agreguen a la lista blanca.
        </p>
      </div>

      <div id="app">
        <div class="card">
          <div class="toolbar">
            <span id="modeBadge" class="badge">…</span>
            <span class="msg" id="userEmail"></span>
            <span class="msg" id="updatedAt"></span>
          </div>
          <div class="toolbar">
            <button type="button" class="primary" id="btnSave">Guardar cambios</button>
            <button type="button" id="btnAdd">+ Ponencia</button>
            <button type="button" id="btnReload">Recargar</button>
            <button type="button" class="danger" id="btnDrive">
              Regenerar desde Drive
            </button>
          </div>
          <p class="msg" id="status"></p>
        </div>
        <div id="list"></div>
      </div>
    </main>

    <script>
      var items = [];
      var autorizadoTpl = <?= autorizado ? "true" : "false" ?>;
      var emailTpl = <?= JSON.stringify(email || "") ?>;

      function $(id) {
        return document.getElementById(id);
      }

      function setStatus(text, kind) {
        var el = $("status");
        el.textContent = text || "";
        el.className = "msg" + (kind === "err" ? " msg--err" : kind === "ok" ? " msg--ok" : "");
      }

      function isFijo(it) {
        return it.tipo === "apertura" || it.tipo === "indicaciones";
      }

      function render() {
        var list = $("list");
        list.innerHTML = "";
        items.forEach(function (it, idx) {
          var fijo = isFijo(it);
          var wrap = document.createElement("div");
          wrap.className = "item" + (fijo ? " item--fijo" : "");
          wrap.innerHTML =
            '<div class="item-head">' +
            '<div class="item-meta">' +
            escapeHtml(it.hora || "") +
            (it.horaFin ? "–" + escapeHtml(it.horaFin) : "") +
            " · " +
            escapeHtml(String(it.tipo || "").toUpperCase()) +
            (fijo ? " · fijo" : "") +
            "</div>" +
            '<div class="item-actions" data-idx="' +
            idx +
            '"></div></div>' +
            (fijo
              ? '<p style="margin:0;font-weight:600">' +
                escapeHtml(it.titulo || "") +
                "</p><p class=\"item-meta\" style=\"margin:0.25rem 0 0\">" +
                escapeHtml(it.persona || "") +
                (it.rol ? " · " + escapeHtml(it.rol) : "") +
                "</p>"
              : fieldsHtml(it, idx));
          list.appendChild(wrap);
          if (!fijo) {
            var actions = wrap.querySelector(".item-actions");
            actions.appendChild(btn("↑", function () {
              move(idx, -1);
            }));
            actions.appendChild(btn("↓", function () {
              move(idx, 1);
            }));
            actions.appendChild(
              btn("Eliminar", function () {
                if (confirm("¿Eliminar esta ponencia?")) {
                  items.splice(idx, 1);
                  render();
                }
              }, "danger")
            );
          }
        });
      }

      function fieldsHtml(it, idx) {
        return (
          '<label>Título</label><input type="text" data-f="titulo" data-i="' +
          idx +
          '" value="' +
          escapeAttr(it.titulo || "") +
          '" />' +
          '<div class="row2">' +
          '<div><label>Persona</label><input type="text" data-f="persona" data-i="' +
          idx +
          '" value="' +
          escapeAttr(it.persona || "") +
          '" /></div>' +
          '<div><label>Rol</label><input type="text" data-f="rol" data-i="' +
          idx +
          '" value="' +
          escapeAttr(it.rol || "Expositor/a") +
          '" /></div></div>' +
          '<label>Área</label><input type="text" data-f="area" data-i="' +
          idx +
          '" value="' +
          escapeAttr(it.area || "") +
          '" />' +
          '<label class="check"><input type="checkbox" data-f="confirmado" data-i="' +
          idx +
          '" ' +
          (it.confirmado ? "checked" : "") +
          " /> Confirmada (no provisional)</label>"
        );
      }

      function btn(label, fn, cls) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        if (cls) b.className = cls;
        b.addEventListener("click", fn);
        return b;
      }

      function move(idx, dir) {
        var j = idx + dir;
        if (j < 0 || j >= items.length) return;
        if (isFijo(items[idx]) || isFijo(items[j])) return;
        var tmp = items[idx];
        items[idx] = items[j];
        items[j] = tmp;
        syncFieldsFromDom();
        render();
      }

      function syncFieldsFromDom() {
        var nodes = document.querySelectorAll("[data-f][data-i]");
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          var idx = Number(el.getAttribute("data-i"));
          var f = el.getAttribute("data-f");
          if (!items[idx] || isFijo(items[idx])) continue;
          if (f === "confirmado") items[idx].confirmado = !!el.checked;
          else items[idx][f] = el.value;
        }
      }

      document.addEventListener("change", function (e) {
        var t = e.target;
        if (t && t.getAttribute("data-f")) syncFieldsFromDom();
      });
      document.addEventListener("input", function (e) {
        var t = e.target;
        if (t && t.getAttribute("data-f")) syncFieldsFromDom();
      });

      function applyPayload(res) {
        if (!res || !res.ok) {
          showDeny(res);
          return;
        }
        $("deny").classList.remove("show");
        $("app").classList.add("show");
        items = Array.isArray(res.items) ? res.items.slice() : [];
        $("userEmail").textContent = res.email ? "Sesión: " + res.email : "";
        $("updatedAt").textContent = res.updatedAt
          ? "Actualizado: " + res.updatedAt
          : "";
        var badge = $("modeBadge");
        if (res.manual) {
          badge.textContent = "Modo: manual";
          badge.className = "badge badge--manual";
        } else {
          badge.textContent = "Modo: automático (Drive)";
          badge.className = "badge";
        }
        render();
      }

      function showDeny(res) {
        $("app").classList.remove("show");
        $("deny").classList.add("show");
        var em = (res && res.email) || emailTpl || "";
        $("denyEmail").textContent = em
          ? "Correo detectado: " + em
          : "No se detectó correo (cerrá sesión de Google y volvé a abrir el enlace).";
        if (res && res.error) $("denyText").textContent = res.error;
      }

      function load() {
        setStatus("Cargando…");
        google.script.run
          .withSuccessHandler(function (res) {
            setStatus("");
            applyPayload(res);
          })
          .withFailureHandler(function (err) {
            setStatus(String(err), "err");
            showDeny({ error: String(err), email: emailTpl });
          })
          .editorProgramaCargar();
      }

      $("btnSave").addEventListener("click", function () {
        syncFieldsFromDom();
        setStatus("Guardando…");
        $("btnSave").disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            $("btnSave").disabled = false;
            if (!res || !res.ok) {
              setStatus((res && res.error) || "Error al guardar", "err");
              return;
            }
            setStatus(res.message || "Guardado", "ok");
            applyPayload(res);
          })
          .withFailureHandler(function (err) {
            $("btnSave").disabled = false;
            setStatus(String(err), "err");
          })
          .editorProgramaGuardar(items);
      });

      $("btnAdd").addEventListener("click", function () {
        syncFieldsFromDom();
        items.push({
          tipo: "ponencia",
          titulo: "Nueva ponencia",
          persona: "",
          rol: "Expositor/a",
          area: "",
          confirmado: false,
          notas: "",
          clave: ""
        });
        render();
      });

      $("btnReload").addEventListener("click", load);

      $("btnDrive").addEventListener("click", function () {
        if (
          !confirm(
            "Esto reemplaza el programa editado por el armado automático desde Drive. ¿Continuar?"
          )
        ) {
          return;
        }
        setStatus("Regenerando desde Drive…");
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || !res.ok) {
              setStatus((res && res.error) || "Error", "err");
              return;
            }
            setStatus(res.message || "OK", "ok");
            applyPayload(res);
          })
          .withFailureHandler(function (err) {
            setStatus(String(err), "err");
          })
          .editorProgramaDesdeDrive();
      });

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, "&quot;");
      }

      if (!autorizadoTpl) {
        showDeny({ email: emailTpl, error: "No autorizado con este correo." });
      } else {
        $("app").classList.add("show");
        load();
      }
    </script>
  </body>
</html>
