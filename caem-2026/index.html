<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sistema de consulta CAEM 2026: encontrá horario, tema, tipo de exposición, disertante y aula."
    />
    <meta name="theme-color" content="#0b1f4a" />
    <title>CAEM 2026 — Encontrá tu sesión</title>
    <link rel="icon" type="image/png" href="assets/logo-caem.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Ir al contenido</a>

    <header class="site-header">
      <div class="header-inner">
        <img
          class="brand-logo"
          src="assets/logo-caem.png"
          width="96"
          height="115"
          alt="CAEM 2026 — 26° Congreso Argentino de Educación Médica"
          decoding="async"
        />
        <div class="brand-copy">
          <p class="brand-kicker">AFACIMERA · Facultad de Medicina UBA</p>
          <h1 class="brand-title">CAEM 2026</h1>
          <p class="brand-sub">¿Qué querés encontrar?</p>
          <p class="brand-dates">16 al 18 de septiembre de 2026</p>
        </div>
      </div>
    </header>

    <nav class="botonera" aria-label="Cómo buscar" id="botonera">
      <button type="button" class="mode-btn is-active" data-mode="horario">
        <span class="mode-icon" aria-hidden="true">Hr</span>
        Horario
      </button>
      <button type="button" class="mode-btn" data-mode="tema">
        <span class="mode-icon" aria-hidden="true">Ej</span>
        Tema
      </button>
      <button type="button" class="mode-btn" data-mode="tipo">
        <span class="mode-icon" aria-hidden="true">Tp</span>
        Tipo
      </button>
      <button type="button" class="mode-btn" data-mode="disertante">
        <span class="mode-icon" aria-hidden="true">Di</span>
        Disertante
      </button>
      <button type="button" class="mode-btn" data-mode="aula">
        <span class="mode-icon" aria-hidden="true">Au</span>
        Aula
      </button>
      <button type="button" class="mode-btn mode-btn-now" data-mode="ahora">
        <span class="mode-icon" aria-hidden="true">Now</span>
        Ahora
      </button>
    </nav>

    <main id="contenido" class="main">
      <section class="step-panel" id="step-panel" aria-live="polite">
        <div class="step-head">
          <h2 class="step-title" id="step-title">Elegí el día</h2>
          <p class="step-help" id="step-help">Primero el día, después el horario.</p>
        </div>
        <div class="step-tools" id="step-tools" hidden>
          <label class="sr-only" for="person-filter">Filtrar nombres</label>
          <input
            id="person-filter"
            class="person-filter"
            type="search"
            placeholder="Escribí un apellido o nombre…"
            autocomplete="off"
          />
        </div>
        <div class="option-grid" id="option-grid" role="listbox" aria-label="Opciones"></div>
      </section>

      <section class="results" id="results" aria-label="Resultados" hidden>
        <div class="results-head">
          <h2 class="results-title" id="results-title">Resultados</h2>
          <button type="button" class="back-btn" id="back-btn">← Cambiar filtro</button>
        </div>
        <div id="results-body"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Fuente: Programa Académico CAEM 2026.
        <a href="https://caem.afacimera.org.ar/" target="_blank" rel="noopener noreferrer"
          >Sitio oficial</a
        >
      </p>
      <p class="footer-note">Sistema de consulta · Observatorio de IA · UCCuyo</p>
    </footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
