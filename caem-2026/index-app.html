<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAEM 2026 — Redirigiendo…</title>
    <meta
      name="description"
      content="La App de Consulta CAEM 2026 se abrió en su dirección actualizada."
    />
    <meta http-equiv="refresh" content="0; url=https://caem-2026-app.web.app/" />
    <link rel="canonical" href="https://caem-2026-app.web.app/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0b1f4a;
        color: #fff;
        text-align: center;
        padding: 1.5rem;
      }
      a {
        color: #9ec5ff;
      }
    </style>
    <script>
      (function () {
        var dest = "https://caem-2026-app.web.app/";
        try {
          dest = dest + location.search + location.hash;
        } catch (_e) {}

        // Clear old PWA cache so returning visitors are not stuck on the previous app.
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }

        location.replace(dest);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirigiendo a la App de Consulta CAEM 2026…<br />
      <a href="https://caem-2026-app.web.app/">Tocá acá si no abre sola</a>
    </p>
  </body>
</html>
