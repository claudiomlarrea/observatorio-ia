<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Encuesta a docentes 2026 — percepción y uso de IA. Observatorio de Inteligencia Artificial, UCCuyo."
    />
    <title>Encuesta a docentes 2026 | Observatorio de IA</title>
    <link rel="icon" type="image/png" href="assets/logo-observatorio-ia.png" />
    <style>
      :root {
        --verde: #064a38;
        --verde-medio: #0d6e4f;
        --amarillo: #e8b923;
        --blanco: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a0a10;
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      /* Ancho limitado por alto de pantalla para no romper la proporción 2:3 del PNG */
      .flyer {
        position: relative;
        display: block;
        width: min(28rem, 100%, calc((100vh - 2rem) * 2 / 3));
        aspect-ratio: 2 / 3;
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        background: var(--verde);
        text-decoration: none;
      }

      .flyer img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        user-select: none;
      }

      /* Medido pixel a pixel sobre el PNG (botón verde) */
      .flyer-cta {
        position: absolute;
        left: 16.1%;
        right: 16.2%;
        bottom: 6.2%;
        height: 7.8%;
        border-radius: 999px;
        z-index: 2;
      }

      .flyer:focus-visible {
        outline: 3px solid var(--amarillo);
        outline-offset: 4px;
      }

      .flyer:focus-visible .flyer-cta,
      .flyer-cta:focus-visible {
        outline: 3px solid var(--amarillo);
        outline-offset: 2px;
      }

      .flyer:hover .flyer-cta {
        box-shadow: 0 0 0 3px rgba(232, 185, 35, 0.55);
      }

      .btn-direct {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.85rem 1.35rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, var(--verde-medio), var(--verde));
        color: var(--blanco);
        font-weight: 700;
        text-decoration: none;
        font-size: 1rem;
        box-shadow: 0 8px 24px rgba(6, 74, 56, 0.45);
      }

      .btn-direct:hover {
        filter: brightness(1.08);
      }

      .hint {
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.9rem;
        margin: 0;
        text-align: center;
        max-width: 28rem;
        line-height: 1.4;
      }

      .fallback a {
        color: #f3d78a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="stack">
        <p class="hint">
          Tocá el botón verde del flayer (o cualquier parte del flayer) para ir a
          la sección de encuestas del Observatorio.
        </p>
        <a
          class="flyer"
          href="https://claudiomlarrea.github.io/observatorio-ia/#encuestas"
          aria-label="Participá en la encuesta a docentes — ir a Encuestas"
        >
          <img
            src="assets/flayer-encuesta-docentes-2026-stories.png?v=2"
            width="1024"
            height="1536"
            alt="Encuesta a docentes 2026 — percepción y uso de IA — Observatorio de IA UCCuyo"
            decoding="async"
          />
          <span class="flyer-cta" aria-hidden="true"></span>
        </a>
        <a
          class="btn-direct"
          href="https://claudiomlarrea.github.io/observatorio-ia/#encuestas"
          >Participá en la encuesta</a
        >
        <p class="hint fallback">
          Si el flayer no responde, usá este enlace:
          <a href="https://claudiomlarrea.github.io/observatorio-ia/#encuestas"
            >observatorio-ia/#encuestas</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
