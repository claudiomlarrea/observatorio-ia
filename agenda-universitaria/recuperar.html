<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Volver a la agenda</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #0b1f3a;
        color: #fff;
        font-family: Outfit, Arial, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        max-width: 22rem;
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
      }
      .hint {
        font-size: 1rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
      }
      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #fff;
        color: #0b1f3a;
        font: inherit;
        font-size: 1.125rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Volviendo a la agenda. No se borra nada.</p>
    <p class="hint" id="estado">Sirve también en Microsoft Edge.</p>
    <a id="ir" href="./">Abrir la agenda</a>
    <script>
      (function () {
        var eventsKey = "agenda-uni:v2:events";
        var status = document.getElementById("estado");
        var home = document.getElementById("ir");
        var folder = window.location.pathname.replace(/recuperar\.html.*$/, "");
        if (!folder.endsWith("/")) folder += "/";
        var target = window.location.origin + folder + "?v=" + Date.now();

        function goHome() {
          try {
            window.location.replace(target);
          } catch (err) {
            window.location.href = target;
          }
        }

        function keepGoodEvents() {
          try {
            var raw = window.localStorage.getItem(eventsKey);
            if (!raw) return;
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return;
            var clean = parsed.filter(function (item) {
              return item && typeof item === "object" && (item.id || item.title);
            });
            if (clean.length !== parsed.length) {
              window.localStorage.setItem(eventsKey, JSON.stringify(clean));
            }
          } catch (err) {
            /* keep the saved agenda as-is */
          }
        }

        async function recover() {
          keepGoodEvents();
          try {
            if ("serviceWorker" in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }
            if ("caches" in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }
          } catch (err) {
            /* still go home */
          }
          if (status) status.textContent = "Abriendo Horario y Reuniones…";
          if (home) home.setAttribute("href", target);
          window.setTimeout(goHome, 200);
          window.setTimeout(function () {
            if (location.pathname.indexOf("recuperar") !== -1) {
              window.location.href = target;
            }
          }, 1200);
        }

        home.addEventListener("click", function (event) {
          event.preventDefault();
          window.location.href = target;
        });
        recover();
      })();
    </script>
  </body>
</html>
