<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Convocatoria Semillero de Inteligencia Artificial 2026 — Observatorio de IA, UCCuyo. Inscripción para estudiantes."
    />
    <title>Semillero de IA 2026 | Observatorio de IA</title>
    <link rel="icon" type="image/png" href="assets/logo-observatorio-ia.png" />
    <style>
      :root {
        --verde: #064a38;
        --verde-medio: #0d6e4f;
        --amarillo: #e8b923;
        --blanco: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a0a10;
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      .flyer {
        position: relative;
        display: block;
        width: min(100%, 28rem);
        aspect-ratio: 9 / 16;
        max-height: calc(100vh - 2rem);
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        background: var(--verde);
        text-decoration: none;
      }

      .flyer img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        pointer-events: none;
        user-select: none;
      }

      /* Zona del QR + CTA */
      .flyer-cta {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 8.5%;
        height: 32%;
        border-radius: 1rem;
        z-index: 2;
      }

      .flyer:focus-visible {
        outline: 3px solid var(--amarillo);
        outline-offset: 4px;
      }

      .flyer:hover .flyer-cta {
        box-shadow: 0 0 0 3px rgba(232, 185, 35, 0.55);
      }

      .btn-direct {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.85rem 1.35rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, var(--verde-medio), var(--verde));
        color: var(--blanco);
        font-weight: 700;
        text-decoration: none;
        font-size: 1rem;
        box-shadow: 0 8px 24px rgba(6, 74, 56, 0.45);
      }

      .btn-direct:hover {
        filter: brightness(1.08);
      }

      .hint {
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.9rem;
        margin: 0;
        text-align: center;
        max-width: 28rem;
        line-height: 1.4;
      }

      .fallback a {
        color: #f3d78a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="stack">
        <p class="hint">
          Escaneá el QR del flayer o tocá el flayer / el botón para completar el
          formulario de inscripción al Semillero de IA.
        </p>
        <a
          class="flyer"
          href="https://docs.google.com/forms/d/1qHvn-2PLpb0zLi0j_g69Jv3CVsTcz7hZwHjl43bfq04/viewform"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Inscribite al Semillero de IA — abrir formulario"
        >
          <img
            src="assets/flayer-semillero-ia-2026-stories.png"
            width="1080"
            height="1920"
            alt="Semillero de Inteligencia Artificial 2026 — Convocatoria Observatorio de IA UCCuyo"
            decoding="async"
          />
          <span class="flyer-cta" aria-hidden="true"></span>
        </a>
        <a
          class="btn-direct"
          href="https://docs.google.com/forms/d/1qHvn-2PLpb0zLi0j_g69Jv3CVsTcz7hZwHjl43bfq04/viewform"
          target="_blank"
          rel="noopener noreferrer"
          >Completá el formulario</a
        >
        <p class="hint fallback">
          Si el flayer no responde, usá este enlace:
          <a
            href="https://docs.google.com/forms/d/1qHvn-2PLpb0zLi0j_g69Jv3CVsTcz7hZwHjl43bfq04/viewform"
            target="_blank"
            rel="noopener noreferrer"
            >Formulario Semillero de IA</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
